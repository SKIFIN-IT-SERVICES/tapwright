name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      # TODO(M1): once the hal/ layer lands (ARCHITECTURE.md), set up vcan
      # here so tests exercise the real zero-hardware bus path, e.g.:
      #   sudo modprobe vcan
      #   sudo ip link add dev vcan0 type vcan
      #   sudo ip link set up vcan0
      - run: pytest --cov=tapwright --cov-report=term-missing
