# SPDX-License-Identifier: Apache-2.0
#
# CI is the verification ladder (DEVELOPMENT-PLAN §3). Each job is a tier, and
# every change declares the highest tier it must reach:
#
#   T0 static       lint, format, types, SPDX, licence policy
#   T1 unit         no I/O
#   T2 integration  full stack on vcan + the virtual ECU, zero hardware
#   T3 differential vs. the wrapped library called directly, or a golden trace
#   T4 property     hypothesis-generated inputs; invariants hold; no crash
#   T5 human        reviewer approval against the SPEC, not against the diff
#
# T3 is the tier that makes this project work: because Tapwright wraps rather
# than rewrites, we can nearly always ask whether our abstraction produces
# byte-identical results to calling the underlying library directly. That is a
# cheap, strong oracle for the most dangerous failure mode in this domain — a
# silently wrong decode, which produces plausible numbers and raises nothing.
#
# The `guardrails` job is not optional. See §4.5.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  t0-static:
    name: T0 · static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: pip install -e ".[dev]"
      - name: ruff check
        run: ruff check .
      - name: ruff format
        run: ruff format --check .
      - name: mypy
        run: mypy src
      - name: SPDX headers (FW-REQ-050)
        run: python tools/check_spdx.py
      - name: Licence policy (FW-REQ-017, C-7, C-9)
        run: python tools/check_licences.py

  t1-unit:
    name: T1 · unit (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest tests/unit tests/test_smoke.py -v

  t2-integration:
    name: T2 · integration (vcan)
    runs-on: ubuntu-latest
    timeout-minutes: 15 # backstop: bring-up-vcan bounds its own apt-get retries
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      # ADR-005 / C-5: the zero-hardware path is first-class, never a fallback.
      # The entire internal suite has to run here, on a stock runner, with
      # nothing plugged in — that is both FW-REQ-031 and the contributor
      # onboarding promise.
      - uses: ./.github/actions/bring-up-vcan
      - run: pip install -e ".[dev]"
      - run: pytest tests/integration -v
        env:
          TAPWRIGHT_TEST_CHANNEL: vcan0

  t3-differential:
    name: T3 · differential
    runs-on: ubuntu-latest
    timeout-minutes: 15 # backstop: bring-up-vcan bounds its own apt-get retries
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - uses: ./.github/actions/bring-up-vcan
      - run: pip install -e ".[dev]"
      - name: Fixture integrity (oracle library)
        run: python tools/check_fixtures.py
      # The tier is empty until BUS-01 lands the first differential test, and
      # pytest exits 5 ("no tests collected") rather than 0 for an empty
      # directory. Tolerating 5 keeps the job wired up and runnable now instead
      # of leaving a second TODO(M1) for someone to find later; remove the
      # tolerance once the tier has tests, so an accidentally-empty T3 fails.
      - run: pytest tests/differential -v || [ $? -eq 5 ]
        env:
          TAPWRIGHT_TEST_CHANNEL: vcan0

  t4-property:
    name: T4 · property/fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 15 # backstop: bring-up-vcan bounds its own apt-get retries
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - uses: ./.github/actions/bring-up-vcan
      - run: pip install -e ".[dev]"
      # Empty until the first hardening loop; see the note in t3-differential.
      - run: pytest tests/property -v || [ $? -eq 5 ]
        env:
          TAPWRIGHT_TEST_CHANNEL: vcan0
          HYPOTHESIS_PROFILE: ci

  container:
    name: Container image (RUN-08)
    runs-on: ubuntu-latest
    timeout-minutes: 15 # backstop: bring-up-vcan bounds its own apt-get retries
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      # Not for a vcan0 on the runner itself -- the container creates its
      # own, in its own network namespace -- but for the vcan kernel
      # module, which containers share with the host and cannot load
      # themselves (see quickstart.py's own docstring).
      - uses: ./.github/actions/bring-up-vcan
      - run: pip install -e ".[dev]"
      - run: pytest tests/integration/test_container.py -v

  coverage-ratchet:
    name: Coverage ratchet (L0-L2)
    runs-on: ubuntu-latest
    timeout-minutes: 15 # backstop: bring-up-vcan bounds its own apt-get retries
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - uses: ./.github/actions/bring-up-vcan
      - run: pip install -e ".[dev]"
      - run: pytest --cov=tapwright --cov-branch --cov-report=xml --cov-report=term-missing
        env:
          TAPWRIGHT_TEST_CHANNEL: vcan0
      # 85% line / 75% branch on L0-L2, as a ratchet: may rise, never falls.
      # No gate on L3 — failures there are loud (DECISIONS-RECORD §4).
      - run: python tools/coverage_ratchet.py coverage.xml

  guardrails:
    name: Guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # blast-radius check needs history to diff against
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: pip install -e ".[dev]"

      # The agentic-specific additions. Everything above verifies the product;
      # this job verifies the *process* that produced it — that nobody made a
      # failing test pass by editing what it was testing against.
      - name: Fixture immutability + provenance
        run: python tools/check_fixtures.py
      - name: Fixture-change trailer + blast radius
        if: github.event_name == 'pull_request'
        run: python tools/check_blast_radius.py --base origin/${{ github.base_ref }}
        env:
          BLAST_RADIUS: ${{ github.event.pull_request.body }}
      - name: Forbidden capability scan (C-10, ADR-003)
        run: python tools/check_forbidden.py
      - name: LGPL vendoring scan (C-9, HAL-08)
        run: python tools/check_licences.py
