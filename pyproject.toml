# SPDX-License-Identifier: Apache-2.0

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tapwright"
version = "0.0.1.dev0"
description = "CI-native, open-core UDS/DoIP diagnostic test runner and DBC/ARXML-aware trace analyzer for automotive software testing."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "Tapwright contributors" },
]
keywords = [
    "automotive",
    "can-bus",
    "uds",
    "doip",
    "diagnostics",
    "iso14229",
    "dbc",
    "arxml",
    "pytest",
    "testing",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Networking",
]

# Real dependencies added as each loop needs them (INF-05, HAL-01/02,
# DIAG-01/02/03, BUS-01) — the virtual ECU, HAL backends, and DBC decode all
# ship as part of the installed package, not repo-only tooling, per
# TOOL-REQ-026's "pip install-only user" acceptance criterion. Each has a
# verified entry in licences.toml; python-can is LGPL-3.0 (NOT BSD-2-Clause
# — an earlier estimate was wrong, see docs/framework-requirements.md's
# correction note) and used as a dependency-only, never vendored (C-9,
# FW-REQ-019, HAL-08). asammdf gets added as BUS-06 needs it.
dependencies = [
    "python-can>=4.3",
    "can-isotp>=2",
    "udsoncan>=1.26",
    "doipclient>=1.1",
    "cantools>=42",  # fixtures/expected/*.json were derived against 42.0.3
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "hypothesis>=6",          # T4 property/fuzz tier
    "ruff",
    "mypy",
    "pre-commit",
    "tomli; python_version<'3.11'",  # tomllib landed in 3.11; the floor is 3.10
]

# RUN-01 / TOOL-REQ-028: auto-discovered on `pip install tapwright` — a user
# needs no `pytest_plugins = [...]` to get the ecu/bus/uds fixtures. This
# entry point is what makes that "zero custom test-runner boilerplate".
[project.entry-points.pytest11]
tapwright = "tapwright.runner.plugin"

# RUN-05 / TOOL-REQ-030 / ADR-001: the unified CLI entry point. A thin
# pass-through to pytest.main() (tapwright.runner.cli) -- see that module's
# docstring for why this isn't a reimplementation of test execution.
[project.scripts]
tapwright = "tapwright.runner.cli:main"

[project.urls]
Homepage = "https://github.com/SKIFIN-IT-SERVICES/tapwright"
Repository = "https://github.com/SKIFIN-IT-SERVICES/tapwright"
Issues = "https://github.com/SKIFIN-IT-SERVICES/tapwright/issues"
Changelog = "https://github.com/SKIFIN-IT-SERVICES/tapwright/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# The verification ladder (DEVELOPMENT-PLAN §3) is expressed as directories, so
# CI can run one tier at a time and a change can declare the tier it must reach:
#   tests/unit          T1  no I/O
#   tests/integration   T2  full stack on vcan, zero hardware
#   tests/differential  T3  vs. the wrapped library called directly
#   tests/property      T4  hypothesis-generated inputs
markers = [
    "requires_vcan: needs a vcan interface (Linux only; skipped elsewhere)",
    "requires_hardware: needs a physical CAN interface — never runs in CI",
    "requires_docker: needs a working docker CLI + daemon; skipped elsewhere",
]

[tool.coverage.run]
branch = true
source = ["tapwright"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
